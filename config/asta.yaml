# ASTA V0.1 runtime configuration.
# Values wrapped in ${VAR} are filled from the environment / .env file.

environment: development
log_level: INFO
dry_run: false

scheduler:
  tick_seconds: 60
  respect_timeframe: true

validator:
  min_confidence: 0.35
  max_signal_age_seconds: 3600

storage:
  signal_history_path: data/signal_history.jsonl
  dedup_window_seconds: 3600

providers:
  binance:
    base_url: https://api.binance.com
    timeout_seconds: 15
  oanda:
    base_url: https://api-fxpractice.oanda.com
    api_token: ${OANDA_API_TOKEN}
    account_id: ${OANDA_ACCOUNT_ID}
    timeout_seconds: 15
  stock:
    base_url: https://query1.finance.yahoo.com
    timeout_seconds: 20

markets:
  # OANDA is not wired during the trial -> forex scanners stay disabled
  forex:
    enabled: false
    symbols: [EUR_USD, GBP_USD, USD_JPY]
  crypto:
    enabled: true
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT]
  stock:
    enabled: true
    symbols: [AAPL, MSFT, NVDA, TSLA, AMZN]

# Per-scanner overrides applied on top of each scanner's config.yaml
scanner_overrides:
  FXS001_RSI_DIVERGENCE:
    params:
      lookback: 120
  FXS002_EMA_CROSSOVER:
    params:
      fast_period: 20
      slow_period: 50
  CXS001_RSI_DIVERGENCE:
    timeframe: 1h
  CXS002_VOLUME_SPIKE:
    params:
      spike_multiplier: 3.0
  CXS003_BREAKOUT_TREND:
    params:
      breakout_lookback: 30
  STS001_EMA_TREND:
    params:
      fast_period: 20
      slow_period: 50
  STS002_BREAKOUT_TREND:
    timeframe: 1d
