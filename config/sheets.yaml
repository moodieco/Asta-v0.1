# Spreadsheet export of accepted signals.
# driver: csv    -> appends to a local CSV (open/import it in Google Sheets or Excel)
#         google -> appends to a Google Sheet (service account shared as Editor)
enabled: true
driver: google
csv_path: data/history/signals_export.csv
state_path: data/history/sheet_sync_state.json
spreadsheet_id: "1peXUsBt_fbHLfri4CUPZgjikCzVKQcwXBefbZAB0okw"
sheet_name: Signals
create_if_missing: true
# Service account is preferred when set; otherwise the OAuth token file is used.
service_account_path: ~/.asta/google_service_account.json
token_path: ~/.hermes/google_token.json
batch_size: 200
auto_sync: true                     # export new signals after every scan cycle
