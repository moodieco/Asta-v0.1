# Which markets run, and which symbols each scanner should cover.
# Empty symbol list -> fall back to markets/<market>/market_config.yaml.

markets:
  forex:
    enabled: false            # OANDA is not wired during the trial
    symbols: [EUR_USD, GBP_USD, USD_JPY]
  crypto:
    enabled: true
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT, BNBUSDT, XRPUSDT]
  stock:
    enabled: true
    symbols: [AAPL, MSFT, NVDA, TSLA, AMZN]

# Per-scanner overrides: enabled / timeframe / params / symbols
scanner_overrides:
  FXS001_RSI_DIVERGENCE:
    params:
      lookback: 120
  FXS002_EMA_CROSSOVER:
    params:
      fast_period: 20
      slow_period: 50
  CXS001_RSI_DIVERGENCE:
    timeframe: 1h
  CXS002_VOLUME_SPIKE:
    params:
      spike_multiplier: 3.0
  CXS003_BREAKOUT_TREND:
    params:
      breakout_lookback: 30
  STS001_EMA_TREND:
    params:
      fast_period: 20
      slow_period: 50
  STS002_BREAKOUT_TREND:
    timeframe: 1d
