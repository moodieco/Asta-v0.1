# Application runtime: environment, scheduling, validation, storage, providers.
# Market universe lives in markets.yaml; secrets live in .env.
# ${VAR} placeholders are expanded from the environment / .env.

environment: development
dry_run: false

scheduler:
  tick_seconds: 60
  respect_timeframe: true

validator:
  min_confidence: 0.35
  max_signal_age_seconds: 3600
  require_levels: true        # only actionable signals (entry + SL + TP) are stored

storage:
  backend: sqlite             # jsonl | sqlite
  signal_history_path: data/history/signals.jsonl
  sqlite_path: data/history/asta.db
  dedup_window_seconds: 3600
  enabled: true

# Local dashboard (asta serve). Loopback access is always open; when `bind` is
# 0.0.0.0 the dashboard is reachable from the LAN and remote requests must
# present a share token (editor or view-only) issued at /api/share.
web:
  host: 127.0.0.1
  port: 4310
  open_browser: true
  bind: 0.0.0.0

# Quick setup bookkeeping; secrets never live here (they go to .env).
setup:
  state_path: config/setup_state.json

providers:
  forex:
    type: mt5
    terminal_url: ${MT5_TERMINAL_URL}
    terminal_token: ${MT5_TERMINAL_TOKEN}
    marketdata_url: ${MT5_MARKETDATA_URL}
    marketdata_token: ${MT5_MARKETDATA_TOKEN}
    timeout_seconds: 30
  crypto:
    type: binance
    base_url: https://api.binance.com
    timeout_seconds: 15
    max_attempts: 3
  stock:
    type: yahoo
    base_url: https://query1.finance.yahoo.com
    timeout_seconds: 20
    max_attempts: 3

