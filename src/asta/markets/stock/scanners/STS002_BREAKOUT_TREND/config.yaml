id: STS002_BREAKOUT_TREND
name: Breakout Trend
market: stock
timeframe: 1d
enabled: true
symbols: []          # empty -> use the market default symbols from config/asta.yaml
description: >
  40-bar high/low breakout on daily bars with 1.3x volume confirmation.
params:
  breakout_lookback: 40
  buffer_pct: 0.005
  trend_period: 100
  min_volume_ratio: 1.3
  max_distance_atr: 3.0
  min_confidence: 0.55

