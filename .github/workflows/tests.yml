name: tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.python-version }})
    # 3.9 is no longer on the ubuntu-latest image (26.04); pin it to 22.04 so the
    # advertised floor (pyproject requires-python >=3.9) stays tested.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate config + scanner packages
        run: python scripts/validate_config.py
      - name: Tests
        run: python -m pytest -q
